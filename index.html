<script>
"use strict";

/* ══════════════ CONFIGURACIÓN (completar al desplegar) ══════════════ */
// URL de la App web de Apps Script (Implementar → App web → URL que termina en /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbyvlPC_Xtx-Z1bZNhnM0217FMXf2niVvhFI93a9dbT5XZxWBkoigYyz-LiP5nA79Sh3/exec";
// Versión de este HTML. Tiene que coincidir con APP_VERSION del Codigo.gs.
// Si no coinciden, la app avisa arriba de todo en vez de fallar con errores
// raros como "Acción desconocida".
const APP_VERSION = "2026-08-26.01";
// Client ID de Google (el mismo de GarantApp)
const GOOGLE_CLIENT_ID = "849214701404-ff11l3oo5k9hecabvf99cnbbgjlegeam.apps.googleusercontent.com";

/* ══════════════ Estado / helpers ══════════════ */
let TOKEN = localStorage.getItem("tf_token") || "";
let USER = JSON.parse(localStorage.getItem("tf_user") || "null");

const VIEWS = [
  { id: "dashboard", label: "📊 Dashboard" },
  { id: "stock", label: "🔄 Sincronización de Stock" },
  { id: "ordenes", label: "📦 Ingreso de Órdenes" },
  { id: "facturas", label: "🧾 Exportación de Facturas" },
  { id: "pdfs", label: "📄 PDF de Facturas" },
  { id: "avtex", label: "📤 Aviso al Marketplace" },
  { id: "skus", label: "🔗 Relación de SKUs" },
  { id: "pendientes", label: "⚠️ SKU Pendientes" },
  { id: "logs", label: "📜 Logs" },
  { id: "config", label: "⚙️ Configuración" },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, tipo = "ok") {
  const col = { ok: "bg-green-600", error: "bg-red-600", info: "bg-violet-700", warning: "bg-amber-600" };
  const el = document.createElement("div");
  el.className = `${col[tipo] || col.info} text-white px-4 py-3 rounded-lg shadow-lg text-sm max-w-sm`;
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
function showModal(html) { $("modal-content").innerHTML = html; $("modal").classList.remove("hidden"); }
function closeModal() { $("modal").classList.add("hidden"); }
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

function confirmar(mensaje, onOk) {
  showModal(`
    <h3 class="font-bold text-lg mb-3">Confirmar</h3>
    <p class="text-sm text-gray-600 mb-6">${esc(mensaje)}</p>
    <div class="flex gap-3 justify-end">
      <button onclick="closeModal()" class="px-4 py-2 rounded-lg border">Cancelar</button>
      <button id="confirm-ok" class="px-4 py-2 rounded-lg bg-violet-700 text-white">Confirmar</button>
    </div>`);
  $("confirm-ok").onclick = () => { closeModal(); onOk(); };
}

/* ══════════════ API (Apps Script) ══════════════ */
// text/plain evita el preflight CORS (patrón probado con GarantApp)
async function api(action, payload) {
  const r = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, token: TOKEN, payload: payload || {} }),
  });
  const data = await r.json();
  if (data.auth) { logout(); throw new Error(data.error); }
  if (data.error) throw new Error(data.error);
  return data.data;
}

function badge(txt, tipo) {
  return `<span class="badge-${tipo} px-2 py-0.5 rounded-full text-xs font-medium">${esc(txt)}</span>`;
}
const resultadoBadge = (r) => badge(r, { ok: "ok", error: "error", warning: "warning",
  "con errores": "warning", "falló": "error" }[r] || "info");
const spinner = (t = "Cargando...") => `<div class="flex items-center gap-3 text-gray-500 p-8">
  <div class="spin w-5 h-5 border-2 border-violet-700 border-t-transparent rounded-full"></div>${esc(t)}</div>`;

/* ══════════════ Parseo de archivos ══════════════ */
// Replica el manejo de encabezados duplicados de pandas: Ciudad, Ciudad.1, ...
function dedupHeaders(headers) {
  const seen = {};
  return headers.map((h) => {
    h = String(h ?? "").trim();
    if (!(h in seen)) { seen[h] = 0; return h; }
    seen[h] += 1;
    return `${h}.${seen[h]}`;
  });
}

// Parser CSV propio (respeta comillas, comas internas y saltos escapados).
// Los CSV de Frávega tienen columnas repetidas y comas dentro de valores, así
// que NO usamos SheetJS para CSV (parsea mal ese caso). SheetJS solo para Excel.
function parseCSVText(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // quitar BOM
  const rows = [];
  let row = [], field = "", i = 0, inQ = false;
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(field); field = ""; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function rowsToObjects(raw) {
  if (!raw.length) return [];
  const headers = dedupHeaders(raw[0]);
  return raw.slice(1)
    .filter((r) => r.some((c) => c !== "" && c !== null && c !== undefined))
    .map((r) => {
      const o = {};
      headers.forEach((h, i) => { o[h] = r[i] ?? ""; });
      return o;
    });
}

function parseFile(file) {
  const esCSV = /\.csv$/i.test(file.name || "");
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
    reader.onload = (e) => {
      try {
        if (esCSV) {
          resolve(rowsToObjects(parseCSVText(e.target.result)));
        } else {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
          resolve(rowsToObjects(raw));
        }
      } catch (err) { reject(err); }
    };
    if (esCSV) reader.readAsText(file, "utf-8");
    else reader.readAsArrayBuffer(file);
  });
}

/* ══════════════ Login ══════════════ */
function initAuth() {
  if (API_URL.indexOf("PEGAR_ACA") === 0) {
    document.body.innerHTML = '<div class="p-10 text-center text-red-600 font-bold">' +
      'Falta configurar API_URL en index.html (la URL /exec del Apps Script).</div>';
    return;
  }
  if (TOKEN && USER) return showApp();
  showLogin();
}

function showLogin() {
  $("app-screen").classList.add("hidden");
  $("login-screen").classList.remove("hidden");
  const render = () => {
    if (!window.google || !google.accounts) return setTimeout(render, 200);
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle });
    google.accounts.id.renderButton($("google-btn"),
      { theme: "filled_blue", size: "large", text: "signin_with", width: 280 });
  };
  render();
}

async function onGoogle(resp) {
  try {
    const r = await fetch(API_URL, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "login", credential: resp.credential }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    TOKEN = data.token;
    USER = { email: data.email, name: data.name };
    localStorage.setItem("tf_token", TOKEN);
    localStorage.setItem("tf_user", JSON.stringify(USER));
    showApp();
  } catch (e) {
    $("login-error").textContent = e.message;
    $("login-error").classList.remove("hidden");
  }
}

function logout() {
  localStorage.removeItem("tf_token"); localStorage.removeItem("tf_user");
  TOKEN = ""; USER = null; location.hash = ""; location.reload();
}

/* ══════════════ Control de versión ══════════════ */
// Compara la versión de este archivo con la del backend desplegado. Sin esto,
// un HTML viejo contra un backend nuevo (o al revés) falla con mensajes que no
// dicen nada, como "Acción desconocida: oncity.orders.preview".
async function verificarVersion() {
  let v;
  try { v = await api("version"); }
  catch (e) {
    return mostrarAvisoVersion(
      "No se pudo consultar la versión del backend (" + e.message + "). " +
      "Puede que la implementación de Apps Script esté desactualizada.");
  }
  if (!v || !v.version) {
    return mostrarAvisoVersion(
      "El backend no informa su versión, así que es anterior a la " + APP_VERSION + ". " +
      "Falta pegar el Codigo.gs nuevo y hacer Implementar → Nueva versión.");
  }
  if (v.version !== APP_VERSION) {
    return mostrarAvisoVersion(
      "Esta pantalla es la versión " + APP_VERSION + " y el backend desplegado es la " +
      v.version + ". Mientras no coincidan va a haber funciones que fallen.");
  }
}

function mostrarAvisoVersion(texto) {
  const div = document.createElement("div");
  div.className = "bg-red-600 text-white px-4 py-3 text-sm";
  div.innerHTML = `<b>⚠️ Versiones desincronizadas.</b> ${esc(texto)}
    <div class="text-xs mt-1 opacity-90">
      1) Pegá el <b>Codigo.gs</b> nuevo y guardá ·
      2) Implementar → Administrar implementaciones → ✏️ → <b>Nueva versión</b> → Implementar ·
      3) Subí el <b>index.html</b> nuevo ·
      4) Recargá acá con <b>Ctrl+Shift+R</b> (o Cmd+Shift+R) para saltear la caché.
    </div>`;
  const main = $("app-screen");
  main.insertBefore(div, main.firstChild);
}

/* ══════════════ Shell ══════════════ */
function showApp() {
  $("login-screen").classList.add("hidden");
  $("app-screen").classList.remove("hidden");
  $("user-name").textContent = USER.name || "";
  $("user-email").textContent = USER.email || "";
  $("app-version").textContent = "v" + APP_VERSION;
  $("nav").innerHTML = VIEWS.map((v) =>
    `<a href="#${v.id}" data-view="${v.id}"
        class="nav-item block px-3 py-2 rounded-lg hover:bg-violet-900">${v.label}</a>`).join("");
  window.addEventListener("hashchange", route);
  route();
  verificarVersion();
}

function currentView() {
  return (location.hash || "#dashboard").slice(1).split("?")[0];
}
// Devuelve true si el usuario SIGUE en la vista indicada. Las vistas async
// deben chequear esto después de cada await antes de pintar, así una llamada
// lenta (p. ej. el dashboard) no sobreescribe la pantalla si ya navegaste.
function stillOn(view) { return currentView() === view; }

function route() {
  const view = currentView();
  document.querySelectorAll(".nav-item").forEach((el) =>
    el.classList.toggle("active", el.dataset.view === view));
  const fn = { dashboard: viewDashboard, stock: viewStock, ordenes: viewOrdenes,
               facturas: viewFacturas, pdfs: viewPdfs, avtex: viewAvtex, skus: viewSkus,
               pendientes: viewPendientes, logs: viewLogs, config: viewConfig
             }[view] || viewDashboard;
  // Sin este try/catch, si una vista falla ANTES de dibujar, la pantalla se
  // queda con lo que había antes y parece que no pasó nada. Preferimos mostrar
  // el error: es la diferencia entre "no anda" y "esto es lo que se rompió".
  try {
    fn();
  } catch (e) {
    setMain(H("Error al abrir la sección") + card(`
      <p class="text-red-600 font-medium mb-2">${esc(e.message)}</p>
      <p class="text-sm text-gray-600 mb-3">Probá recargar con Ctrl+Shift+R. Si sigue,
        el botón de abajo limpia las preferencias guardadas en este navegador
        (pestaña elegida, sesión) sin tocar ningún dato del sistema.</p>
      <button onclick="limpiarPreferencias()" class="border px-4 py-2 rounded-lg text-sm">
        Limpiar preferencias de este navegador</button>
      <pre class="text-xs text-gray-400 mt-3 whitespace-pre-wrap">${esc(e.stack || "")}</pre>`));
    console.error("Error en la vista", view, e);
  }
}

function limpiarPreferencias() {
  ["tf_ordenes_modo", "tf_facturas_modo"].forEach((k) => localStorage.removeItem(k));
  location.reload();
}

const setMain = (h) => { $("main").innerHTML = h; };
const H = (t) => `<h2 class="text-xl font-bold mb-4">${t}</h2>`;
const card = (inner, extra = "") => `<div class="bg-white rounded-xl shadow p-5 ${extra}">${inner}</div>`;

/* ══════════════ DASHBOARD ══════════════ */
async function viewDashboard() {
  setMain(H("Dashboard") + spinner("Consultando Tango y Frávega..."));
  let d;
  try { d = await api("dashboard"); }
  catch (e) { if (!stillOn("dashboard")) return; return setMain(H("Dashboard") + card(`<p class="text-red-600">${esc(e.message)}</p>`)); }
  if (!stillOn("dashboard")) return;  // navegó a otra sección mientras cargaba

  const estado = (s) => s.ok
    ? `<div class="text-green-600 font-bold text-lg">● Conectado</div><div class="text-xs text-gray-500">${esc(s.detalle)}</div>`
    : `<div class="text-red-600 font-bold text-lg">● Sin conexión</div><div class="text-xs text-gray-500">${esc(s.detalle)}</div>`;

  const u = d.sincronizacion.ultima;
  const ultimaTxt = u
    ? `${esc(u.inicio)} — ${resultadoBadge(u.resultado)}<div class="text-xs text-gray-500 mt-1">
       ok: ${u.ok} · errores: ${u.errores} · no publicados: ${u.no_publicados} · sin relación: ${u.sin_relacion}</div>`
    : '<span class="text-gray-400">Nunca se ejecutó</span>';

  setMain(H("Dashboard") + `
    ${d.alertas.length ? `<div class="mb-4 space-y-2">${d.alertas.map((a) =>
      `<div class="bg-amber-50 border border-amber-300 text-amber-800 px-4 py-2 rounded-lg text-sm">⚠️ ${esc(a)}</div>`).join("")}</div>` : ""}
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-4 mb-4">
      ${card(`<div class="text-xs text-gray-500 uppercase mb-1">Tango</div>${estado(d.tango)}`)}
      ${card(`<div class="text-xs text-gray-500 uppercase mb-1">Frávega</div>${estado(d.fravega)}`)}
      ${card(`<div class="text-xs text-gray-500 uppercase mb-1">OnCity (VTEX)</div>
        ${d.oncity ? (d.oncity.habilitado ? estado(d.oncity) +
            (d.oncity.simulacion ? '<div class="text-xs text-amber-700 mt-1">modo simulación</div>' : '')
          : '<div class="text-gray-400 font-bold text-lg">● Deshabilitado</div>') : ''}`)}
      ${card(`<div class="text-xs text-gray-500 uppercase mb-1">Última sincronización</div>${ultimaTxt}`)}
      ${card(`<div class="text-xs text-gray-500 uppercase mb-1">Próxima sincronización</div>
        <div class="font-bold text-lg">${d.sincronizacion.proxima ? esc(d.sincronizacion.proxima) : "—"}</div>
        <div class="text-xs text-gray-500">${d.sincronizacion.habilitada ? "Automática habilitada" : "Automática deshabilitada"}</div>`)}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      ${[["Relaciones de SKU", d.contadores.relaciones, "#skus"],
         ["SKU sin relación", d.contadores.sku_pendientes, "#pendientes"],
         ["Órdenes importadas", d.contadores.ordenes_importadas, "#ordenes"],
         ["Errores (24 hs)", d.contadores.errores_24h, "#logs"]].map(([t, n, href]) =>
        `<a href="${href}" class="bg-white rounded-xl shadow p-5 hover:shadow-md">
           <div class="text-3xl font-bold">${n}</div>
           <div class="text-xs text-gray-500 uppercase mt-1">${t}</div></a>`).join("")}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      ${card(`<div class="text-xs text-gray-500 uppercase mb-2">Última exportación de facturas</div>
        ${d.ultima_exportacion
          ? `${esc(d.ultima_exportacion.fecha_hora)} — ${esc(d.ultima_exportacion.archivo)}
             <div class="text-xs text-gray-500 mt-1">cargadas: ${d.ultima_exportacion.cargadas}
             · sin factura: ${d.ultima_exportacion.sin_factura}</div>`
          : '<span class="text-gray-400">Sin exportaciones aún</span>'}`)}
      ${card(`<div class="text-xs text-gray-500 uppercase mb-2">Errores recientes</div>
        ${d.errores_recientes.length ? d.errores_recientes.map((l) =>
          `<div class="text-sm border-b border-gray-100 py-1">
             <span class="text-gray-400 text-xs">${esc(l.fecha_hora)}</span>
             [${esc(l.modulo)}] ${esc(l.accion)}: <span class="text-red-600">${esc(String(l.detalle).slice(0, 120))}</span></div>`).join("")
          : '<span class="text-gray-400">Sin errores 🎉</span>'}`)}
    </div>`);
}

/* ══════════════ STOCK ══════════════ */
async function viewStock() {
  setMain(H("Sincronización de Stock") + spinner());
  let st, hist;
  try { [st, hist] = await Promise.all([api("stock.status"), api("stock.history")]); }
  catch (e) { if (!stillOn("stock")) return; return setMain(H("Sincronización de Stock") + card(`<p class="text-red-600">${esc(e.message)}</p>`)); }
  if (!stillOn("stock")) return;

  const rows = hist.map((h) => `
    <tr class="cursor-pointer" onclick='verDetalleSync(${JSON.stringify(String(h.detalle_json || "[]"))})'>
      <td>${esc(h.inicio)}</td><td>${esc(h.fin || "—")}</td>
      <td>${esc(h.disparada_por)}</td><td>${esc(h.destino || "—")}</td><td>${resultadoBadge(h.resultado)}</td>
      <td class="text-center">${h.ok}</td><td class="text-center">${h.errores}</td>
      <td class="text-center">${h.no_publicados}</td><td class="text-center">${h.sin_relacion}</td>
    </tr>`).join("");

  setMain(H("Sincronización de Stock") + `
    <div class="flex flex-wrap items-center gap-4 mb-4">
      <select id="sync-destino" class="border rounded-lg px-3 py-2.5 text-sm bg-white">
        <option value="">Todos los destinos habilitados</option>
        <option value="fravega">Solo Frávega</option>
        <option value="oncity">Solo OnCity (VTEX)</option>
      </select>
      <button onclick="dispararSync()"
        class="bg-violet-700 hover:bg-violet-800 text-white px-5 py-2.5 rounded-lg font-medium">
        ▶️ Sincronizar ahora</button>
      <div class="text-sm text-gray-600">Próxima automática:
        <b>${st.proxima ? esc(st.proxima) : "deshabilitada"}</b></div>
      <button onclick="viewStock()" class="text-sm text-violet-700 underline">Actualizar</button>
    </div>
    ${card(`<div class="text-xs text-gray-500 uppercase mb-2">Historial (clic en una fila para ver el detalle)</div>
      <table class="data w-full"><thead><tr>
        <th>Inicio</th><th>Fin</th><th>Disparada por</th><th>Destino</th><th>Resultado</th>
        <th>OK</th><th>Errores</th><th>No public.</th><th>Sin relación</th>
      </tr></thead><tbody>${rows || '<tr><td colspan="9" class="text-gray-400 p-4">Sin sincronizaciones aún</td></tr>'}</tbody></table>`)}`);
}

function dispararSync() {
  const destino = ($("sync-destino") || {}).value || "";
  const comoTexto = destino === "fravega" ? "Frávega"
                  : destino === "oncity" ? "OnCity (VTEX)"
                  : "todos los destinos habilitados";
  confirmar(`¿Sincronizar el stock de Tango (depósito configurado) hacia ${comoTexto} ahora? Puede tardar hasta un minuto.`, async () => {
    setMain(H("Sincronización de Stock") + spinner(`Sincronizando ${comoTexto}... (leyendo Tango y actualizando la tienda)`));
    try {
      const r = await api("stock.sync", { destino });
      if (r.resultado === "omitida") toast(r.mensaje, "warning");
      else {
        toast(`Sincronización ${r.resultado}: ${r.ok} OK, ${r.errores} errores`, r.errores ? "warning" : "ok");
        // Desglose por destino, que es lo que interesa cuando se sincronizan los dos
        const pd = r.por_destino || {};
        Object.keys(pd).forEach((d) => {
          const x = pd[d];
          toast(`${d === "oncity" ? "OnCity" : "Frávega"}: ${x.ok} OK · ${x.errores} errores · ${x.no_publicados} no publicados` +
                (x.simulacion ? " (simulación)" : ""), x.errores ? "warning" : "info");
        });
      }
    } catch (e) { toast(e.message, "error"); }
    viewStock();
  });
}

function verDetalleSync(jsonStr) {
  let detalle;
  try { detalle = JSON.parse(jsonStr); } catch (_) { detalle = []; }
  if (!detalle.length) return;
  showModal(`
    <h3 class="font-bold text-lg mb-3">Detalle de la sincronización</h3>
    <table class="data w-full"><thead><tr><th>Destino</th><th>SKU</th><th>refId</th><th>Cantidad</th><th>Estado</th></tr></thead>
    <tbody>${detalle.map((d) => `<tr><td>${badge(d.destino === "oncity" ? "OnCity" : d.destino === "fravega" ? "Frávega" : (d.destino || "—"), d.destino === "oncity" ? "warning" : "info")}</td>
      <td>${esc(d.sku)}</td><td>${esc(d.refId)}</td>
      <td>${d.cantidad}</td><td>${resultadoBadge(d.estado === "ok" ? "ok" : d.estado === "error" ? "error" : "warning")}
      ${d.detalle ? `<div class="text-xs text-gray-500">${esc(d.detalle)}</div>` : ""}</td></tr>`).join("")}</tbody></table>
    <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 rounded-lg border">Cerrar</button></div>`);
}

/* ══════════════ ÓRDENES ══════════════ */
let ORDENES_ROWS = null, ORDENES_ARCHIVO = "", ORDENES_ANALISIS = null, ORDENES_COMPLETAS = [];
// El valor guardado puede venir de una versión anterior (antes la pestaña de
// Frávega se llamaba "api"). Si no es uno de los actuales, lo descartamos: si
// no, la vista rompe al buscar un canal que no existe.
const MODOS_ORDENES = ["fravega", "oncity", "csv"];
let ORDENES_MODO = localStorage.getItem("tf_ordenes_modo") || "fravega";
if (MODOS_ORDENES.indexOf(ORDENES_MODO) === -1) {
  ORDENES_MODO = "fravega";
  localStorage.setItem("tf_ordenes_modo", ORDENES_MODO);
}

// Los dos marketplaces corren sobre VTEX y comparten todo el flujo: solo
// cambia el canal que se le manda al backend.
const CANALES_UI = {
  fravega: { nombre: "Frávega", icono: "🔵" },
  oncity:  { nombre: "OnCity",  icono: "🏬" },
};
let VTEX_ORDENES = null;   // resultado de la última búsqueda

function viewOrdenes() {
  const tab = (id, txt) => `<button onclick="cambiarModoOrdenes('${id}')"
    class="px-4 py-2 text-sm rounded-lg ${ORDENES_MODO === id

    <div id="auto-panel" class="mb-4"></div>
    <div class="flex gap-2 mb-4 flex-wrap">
      ${tab("fravega", "🔵 Frávega (API)")}
      ${tab("oncity", "🏬 OnCity (API)")}
      ${tab("csv", "📄 Frávega por CSV")}
    </div>
    ${bloque}
    ${card(`<div class="text-xs text-gray-500 uppercase mb-2">Historial de importaciones</div>
      <div id="ordenes-hist">${spinner("Cargando historial...")}</div>`)}`);
  cargarHistorialOrdenes();  // llena SOLO el div del historial, sin tocar la carga
  cargarPanelAuto();
}

/* ── Automatización: estado y disparo manual ────────────────────────── */
async function cargarPanelAuto() {
  const cont = $("auto-panel");
  if (!cont) return;
  let a;
  try { a = await api("orders.autoStatus"); }
  catch (e) { cont.innerHTML = ""; return; }
  if (!$("auto-panel")) return;

  const u = a.ultima;
  const ultimaTxt = u
    ? `${esc(u.fecha_hora)} — <b>${u.enviadas}</b> enviada(s)` +
      (Number(u.rechazadas) ? ` · <span class="text-red-600">${u.rechazadas} rechazada(s)</span>` : "")

  cont.innerHTML = a.habilitada
    ? `<div class="bg-green-50 border border-green-300 rounded-xl px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
         <div><span class="text-green-700 font-bold">● Automático activado</span>
           <span class="text-gray-600">— ${esc(a.canales.join(" y "))} a las ${esc(a.horas)} hs</span></div>
         <div class="text-gray-600">Próxima: <b>${a.proxima ? esc(a.proxima) : "—"}</b></div>
         <div class="${a.agendados > 0 ? "text-gray-600" : "text-red-600 font-bold"}">

         <a href="#config" class="text-violet-700 underline text-xs">Configurar</a>
       </div>`
    : `<div class="bg-gray-100 border border-gray-300 rounded-xl px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
         <div><span class="text-gray-500 font-bold">● Automático desactivado</span>
           <span class="text-gray-600">— las órdenes se traen a mano con los botones de abajo</span></div>
         <div class="text-gray-600">Última corrida automática: ${ultimaTxt}</div>
         <a href="#config" class="ml-auto text-violet-700 underline text-xs">Activarlo en Configuración</a>

function correrAuto() {
  confirmar("Se van a traer los pedidos nuevos de todos los canales configurados y se van a " +
            "enviar a Tango, igual que lo haría el proceso automático. ¿Continuar?", async () => {
    const cont = $("auto-panel");
    cont.innerHTML = `<div class="bg-violet-50 border border-violet-300 rounded-xl p-4">
      ${spinner("Corriendo la importación automática... puede tardar varios minutos")}</div>`;
    let r;
    try { r = await api("orders.autoRun"); }
    catch (e) {
      cont.innerHTML = `<div class="bg-red-50 border border-red-300 rounded-xl p-4 text-sm text-red-700">
        ${esc(e.message)}</div>`;
      return;

    mostrarResultadoAuto(r);

function mostrarResultadoAuto(r) {
  const filas = Object.keys(r.por_canal || {}).map((k) => {
    const d = r.por_canal[k];
    return `<tr><td>${esc(d.nombre)}</td><td class="text-center">${d.leidos}</td>
      <td class="text-center">${d.nuevas}</td><td class="text-center">${d.saltadas}</td>

  showModal(`
    <h3 class="font-bold text-lg mb-3">Corrida automática — ${esc(r.resultado)}</h3>
    <table class="data w-full mb-3"><thead><tr>
      <th>Canal</th><th>Leídos</th><th>Nuevos</th><th>Ya enviados</th>
      <th>Enviados</th><th>Rechazados</th><th></th></tr></thead><tbody>${filas}</tbody></table>
    ${r.excluidas && r.excluidas.length ? `<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-3 mb-2">
      ⚠️ ${r.excluidas.length} orden(es) no se enviaron por SKU sin relación:
      ${r.excluidas.slice(0, 15).map((x) => `<div>· ${esc(x.orden)} → ${x.skus.map(esc).join(", ")}</div>`).join("")}
      <div class="mt-1"><a href="#pendientes" class="underline font-medium" onclick="closeModal()">Ir a SKU Pendientes</a></div></div>` : ""}
    ${r.rechazadas && r.rechazadas.length ? `<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-3 mb-2">
      ❌ Rechazadas por Tango:
      ${r.rechazadas.slice(0, 15).map((x) => `<div>· ${esc(x.orden)}: ${esc(x.error)}</div>`).join("")}</div>` : ""}
    ${r.errores && r.errores.length ? `<div class="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded p-3">
      ${r.errores.map((e) => `<div>· ${esc(e)}</div>`).join("")}</div>` : ""}
    <div class="mt-4 text-right"><button onclick="closeModal(); viewOrdenes();" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);

function cambiarModoOrdenes(modo) {
  ORDENES_MODO = modo;

}

/* ── Flujo por API de VTEX, común a los dos marketplaces ────────────── */

function bloqueOrdenesVtex(canal) {
  if (!CANALES_UI[canal]) canal = "fravega";
  const n = CANALES_UI[canal].nombre;
  const esFravega = canal === "fravega";
  return card(`
    <div class="text-sm text-gray-600 mb-3">
      Trae los pedidos de <b>${n}</b> en estado <b>"Listo para preparación"</b> directamente de la
      API de VTEX. No hace falta descargar ni subir nada.
      ${esFravega ? `
        <div class="mt-2 text-xs bg-violet-50 border border-violet-200 text-violet-900 rounded-lg px-3 py-2">
          Los pedidos de Frávega salen de la <b>Orders API de VTEX</b>, no del Seller Center.
          El Seller Center se sigue usando para el stock, que funciona bien.
        </div>
        <div class="mt-2 text-xs bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-3 py-2">
          ⏱️ <b>Envío Pack:</b> solo se traen pedidos con más de 90 minutos (configurable), que es
          lo que necesita Envío Pack para generar el envío. Esta app <b>nunca ejecuta
          "start-handling"</b>: según la documentación de Frávega, eso lo hace solo el backoffice
          de Frávega Envíos al procesar el pedido.
        </div>` : `
        <div class="mt-2 text-xs bg-violet-50 border border-violet-200 text-violet-900 rounded-lg px-3 py-2">
          Los pedidos de OnCity entran a Tango con su propia <b>condición de venta</b>, para que
          queden distinguibles de los de Frávega.
        </div>`}
      <div class="mt-2 text-xs bg-amber-50 border border-amber-200 text-amber-900 rounded-lg px-3 py-2">
        ⚠️ <b>La primera vez</b> van a aparecer todos los pedidos pendientes, incluidos los que ya
        hayas facturado a mano en Tango. <b>Destildá esos antes de enviar</b> para no duplicarlos.
        De la segunda vez en adelante se saltean solos.
      </div>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <button onclick="buscarOrdenesVtex('${canal}')"
        class="bg-violet-700 hover:bg-violet-800 text-white px-5 py-2.5 rounded-lg font-medium">
        1️⃣ Buscar pedidos en ${n}</button>
      <button onclick="probarVtex('${canal}')" class="border px-4 py-2.5 rounded-lg text-sm">
        🔌 Probar conexión</button>
    </div>
    <div id="ordenes-resultado" class="mt-4"></div>`, "mb-4");
}

async function buscarOrdenesVtex(canal) {
  if (!CANALES_UI[canal]) canal = "fravega";
  const box = $("ordenes-resultado");
  box.innerHTML = spinner(`Consultando los pedidos de ${CANALES_UI[canal].nombre} en VTEX...`);
  try {
    VTEX_ORDENES = await api("vtex.orders.preview", { canal });
  } catch (e) {
    VTEX_ORDENES = null;
    box.innerHTML = `<div class="border border-red-200 bg-red-50 rounded-lg p-4">
      <div class="font-bold text-red-700 mb-1">No se pudieron traer los pedidos</div>
      <div class="text-sm text-red-700">${esc(e.message)}</div></div>`;
    return;
  }
  pintarOrdenesVtex();
}

function pintarOrdenesVtex() {
  const a = VTEX_ORDENES;
  if (!a) return;
  const money = (n) => "$ " + Number(n).toLocaleString("es-AR",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  $("ordenes-resultado").innerHTML = `
    <div class="border rounded-lg p-4 bg-gray-50">
      <div class="text-sm mb-2">
        <b>${a.listados}</b> pedido(s) leídos de <b>${esc(a.nombre)}</b> en estado
        <code>${esc(a.estados.join(", "))}</code>
        ${a.por_estado && Object.keys(a.por_estado).length ? `<div class="text-xs text-gray-500 mt-1">
          ${Object.keys(a.por_estado).map((k) => `<code>${esc(k)}</code>: ${a.por_estado[k]}`).join(" · ")}</div>` : ""}
        <div class="text-xs text-gray-400">Nro de Orden tomado de <code>${esc(a.campo_id)}</code>
          · condición de venta en Tango: <b>${esc(a.condicion_venta)}</b>
          · talonario ${esc(a.talonario)}
          ${a.espera_min ? ` · espera de ${a.espera_min} min` : ""}</div>
      </div>
      <div class="flex gap-4 text-sm mb-3 flex-wrap">
        <span>🆕 Nuevos: <b>${a.nuevas.length}</b></span>
        <span>⏩ Ya enviados: <b>${a.saltadas.length}</b></span>
        <span class="${a.excluidas.length ? "text-red-600" : ""}">🚫 Sin relación de SKU: <b>${a.excluidas.length}</b></span>
        ${a.ignorados && a.ignorados.length ? `<span class="text-gray-500" title="${esc(a.ignorados.join(", "))}">🙈 Ignorados: <b>${a.ignorados.length}</b></span>` : ""}
        ${a.fallidas.length ? `<span class="text-red-600">⚠️ Con error: <b>${a.fallidas.length}</b></span>` : ""}
      </div>

      ${a.alerta ? `<div class="text-sm bg-red-50 border-2 border-red-400 text-red-800 rounded p-3 mb-3">
        <div class="font-bold mb-1">⛔ Frená antes de enviar</div>${esc(a.alerta)}</div>` : ""}

      ${a.truncada ? `<div class="text-sm bg-amber-50 border border-amber-200 text-amber-900 rounded p-3 mb-3">
        Se cortó la lectura para no pasar el límite de tiempo de Google. Enviá estos y volvé a
        apretar "Buscar" para traer el resto.</div>` : ""}

      ${a.nuevas.length ? `
        <div class="flex items-center gap-3 mb-2 text-sm">
          <button onclick="marcarTodosVtex(true)" class="text-violet-700 underline">Tildar todos</button>
          <button onclick="marcarTodosVtex(false)" class="text-violet-700 underline">Destildar todos</button>
          <span id="vtx-contador" class="text-gray-500"></span>
          <button onclick="ignorarVtex()" class="ml-auto text-gray-500 hover:text-red-600 underline"
            title="Saca los tildados de la lista para siempre. Para pedidos que VTEX no mueve de estado y reaparecen en cada búsqueda.">
            🙈 Ignorar los tildados</button>
        </div>
        <div class="max-h-96 overflow-y-auto mb-3">
        <table class="data w-full"><thead><tr>
          <th class="w-8"></th><th>Pedido</th><th>Cliente</th><th>DNI</th><th>Fecha</th>
          <th>Estado</th><th>Ítems</th><th>Total</th><th>Transportadora</th></tr></thead><tbody>
        ${a.nuevas.map((o, i) => `<tr>
          <td><input type="checkbox" class="vtx-chk w-4 h-4" data-i="${i}" checked onchange="contarVtex()"></td>
          <td class="font-mono text-xs">${esc(o.orden)}</td>
          <td>${esc(o.cliente)}</td>
          <td class="font-mono text-xs">${esc(o.documento)}</td>
          <td class="text-xs">${esc(o.fecha)}</td>
          <td class="text-xs">${badge(o.estado === "ready-for-handling" ? "listo"
            : o.estado === "handling" ? "preparando" : (o.estado || "—"),
            o.estado === "handling" ? "warning" : "info")}</td>
          <td class="text-center">${o.items}</td>
          <td>${money(o.total)}${o.aviso ? `<div class="text-xs text-amber-700" title="${esc(o.aviso)}">⚠ revisar total</div>` : ""}</td>
          <td class="text-xs text-gray-500">${esc(o.transportadora || "—")}</td>
        </tr>`).join("")}</tbody></table></div>` : ""}

      ${a.excluidas.length ? `<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-3 mb-3">
        Estos pedidos NO se envían porque tienen SKUs sin relación (ya quedaron en
        <a href="#pendientes" class="underline font-medium">Pendientes</a>):
        ${a.excluidas.map((x) => `<div>· ${esc(x.orden)} → SKU ${x.skus_sin_relacion.map(esc).join(", ")}</div>`).join("")}</div>` : ""}

      ${a.fallidas.length ? `<div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded p-3 mb-3">
        No se pudo leer el detalle de estos pedidos:
        ${a.fallidas.map((x) => `<div>· ${esc(x.orden)}: ${esc(x.error)}</div>`).join("")}</div>` : ""}

      ${a.nuevas.length ? `<button onclick="enviarOrdenesVtex()"
        class="bg-green-700 hover:bg-green-800 text-white px-5 py-2.5 rounded-lg font-medium">
        2️⃣ Confirmar y enviar los tildados a Tango</button>` :
        '<div class="text-gray-500 text-sm">No hay pedidos nuevos para enviar.</div>'}
    </div>`;
  contarVtex();
}

function marcarTodosVtex(v) {
  document.querySelectorAll(".vtx-chk").forEach((c) => { c.checked = v; });
  contarVtex();
}

function contarVtex() {
  const el = $("vtx-contador");
  if (el) el.textContent = `${document.querySelectorAll(".vtx-chk:checked").length} tildado(s) ` +
    `de ${document.querySelectorAll(".vtx-chk").length}`;
}

function enviarOrdenesVtex() {
  const a = VTEX_ORDENES;
  if (!a) return;
  const idx = Array.from(document.querySelectorAll(".vtx-chk:checked")).map((c) => Number(c.dataset.i));
  if (!idx.length) return toast("No hay ningún pedido tildado", "warning");

  const elegidas = idx.map((i) => a.nuevas[i].orden);
  const orders = a.orders.filter((o) => elegidas.indexOf(o.OrderID) !== -1);
  const total = orders.length;

  confirmar(`Se van a crear ${total} pedido(s) de ${a.nombre} en Tango, con condición de venta ` +
            `${a.condicion_venta}. ¿Continuar?`, async () => {
    const TANDA = 25;
    const enviadas = [], rechazadas = [];
    const box = $("ordenes-resultado");

    for (let i = 0; i < total; i += TANDA) {
      const lote = orders.slice(i, i + TANDA);
      const regs = {};
      lote.forEach((o) => { if (a.registros[o.OrderID]) regs[o.OrderID] = a.registros[o.OrderID]; });
      const desde = i + 1, hasta = Math.min(i + TANDA, total);

      box.innerHTML = `
        <div class="border rounded-lg p-4 bg-violet-50">
          ${spinner(`Enviando pedidos ${desde}–${hasta} de ${total} a Tango...`)}
          <div class="text-xs text-gray-500 mt-2">Aceptados hasta ahora: ${enviadas.length}
            ${rechazadas.length ? `· rechazados: ${rechazadas.length}` : ""}</div>
          <div class="w-full bg-violet-200 rounded-full h-2 mt-2">
            <div class="bg-violet-700 h-2 rounded-full" style="width:${Math.round(hasta / total * 100)}%"></div></div>
        </div>`;
      try {
        const r = await api("vtex.orders.send",
          { canal: a.canal, orders: lote, registros: regs, archivo: "API " + a.nombre });
        enviadas.push(...r.enviadas);
        rechazadas.push(...r.rechazadas);
      } catch (e) {
        rechazadas.push({ orden: `tanda ${desde}-${hasta}`, error: e.message });
      }
    }

    const linkFactura = a.canal === "oncity"
      ? 'Exportación de Facturas → OnCity, subí la plantilla del panel y el reporte de Tango'
      : 'Exportación de Facturas → Frávega, subí solo el reporte de Tango';

    box.innerHTML = `
      <div class="border rounded-lg p-4 ${rechazadas.length ? "bg-amber-50" : "bg-green-50"}">
        <div class="font-bold mb-2">✅ Enviados y aceptados por Tango: ${enviadas.length} de ${total}</div>
        <div class="text-sm text-gray-600 mb-2">Para facturar: <a href="#facturas"
          class="underline text-violet-700">${linkFactura}</a>.</div>
        <div class="max-h-40 overflow-y-auto">
          ${enviadas.map((id) => `<span class="inline-block bg-white border rounded px-2 py-0.5 text-xs mr-1 mb-1">${esc(id)}</span>`).join("")}
        </div>
        ${rechazadas.length ? `<div class="font-bold mt-3 mb-1 text-red-700">❌ Rechazados: ${rechazadas.length}</div>

function enviarOrdenes() {
  const total = ORDENES_COMPLETAS.length;
  confirmar(`Se van a crear ${total} pedido(s) en Tango, en tandas de 25. ¿Continuar?`, async () => {
    const TANDA = 25;  // igual al orders_batch_size del backend (25)
    const enviadas = [], rechazadas = [];
    const box = $("ordenes-resultado");

    for (let i = 0; i < total; i += TANDA) {
      const lote = ORDENES_COMPLETAS.slice(i, i + TANDA);
      const desde = i + 1, hasta = Math.min(i + TANDA, total);
      box.innerHTML = `
        <div class="border rounded-lg p-4 bg-violet-50">
          ${spinner(`Enviando órdenes ${desde}–${hasta} de ${total}...`)}
          <div class="text-xs text-gray-500 mt-2">Aceptadas hasta ahora: ${enviadas.length}
            ${rechazadas.length ? `· rechazadas: ${rechazadas.length}` : ""}</div>
          <div class="w-full bg-violet-200 rounded-full h-2 mt-2">
            <div class="bg-violet-700 h-2 rounded-full" style="width:${Math.round(hasta / total * 100)}%"></div></div>
        </div>`;
      try {
        const r = await api("orders.sendBatch", { orders: lote, archivo: ORDENES_ARCHIVO });
        enviadas.push(...r.enviadas);
        rechazadas.push(...r.rechazadas);
      } catch (e) {
        // No cortamos todo: registramos el error de esta tanda y seguimos
        rechazadas.push({ orden: `tanda ${desde}-${hasta}`, error: e.message });
      }
    }

    box.innerHTML = `
      <div class="border rounded-lg p-4 ${rechazadas.length ? "bg-amber-50" : "bg-green-50"}">
        <div class="font-bold mb-2">✅ Enviadas y aceptadas por Tango: ${enviadas.length} de ${total}</div>
        <div class="max-h-40 overflow-y-auto">
          ${enviadas.map((id) => `<span class="inline-block bg-white border rounded px-2 py-0.5 text-xs mr-1 mb-1">${esc(id)}</span>`).join("")}
        </div>
        ${rechazadas.length ? `<div class="font-bold mt-3 mb-1 text-red-700">❌ Rechazadas / con problema: ${rechazadas.length}</div>
          <div class="max-h-40 overflow-y-auto">
          ${rechazadas.map((f) => `<div class="text-sm text-red-700">· ${esc(f.orden)}: ${esc(f.error)}</div>`).join("")}
          </div>` : ""}
      </div>`;
    toast(`${enviadas.length} órdenes enviadas a Tango`, rechazadas.length ? "warning" : "ok");
    // Registrar UNA fila de resumen en el Historial de importaciones. El envío
    // por tandas (orders.sendBatch) no lo hacía, por eso no aparecía el import.
    try {
      const a = ORDENES_ANALISIS || {};
      await api("orders.recordImport", {
        archivo: ORDENES_ARCHIVO,
        total_filas: a.total_filas,
        filas_pendientes: a.filas_pendientes,
        nuevas: total,
        enviadas: enviadas,
        rechazadas: rechazadas,
        excluidas: a.excluidas || [],
        saltadas: a.saltadas || [],
      });
    } catch (e) { /* el historial es secundario: no cortamos el flujo */ }
    cargarHistorialOrdenes();
  });
}

/**
 * Lee la plantilla de OnCity SIN convertir tipos: la fecha viene como texto
 * ("21/08/2026 10:17:45") y el valor como número. Si dejáramos que la librería
 * los interprete, al reescribir el archivo cambiarían de formato y OnCity lo
 * rechazaría. Por eso raw:true y cellDates:false.
 */
function leerPlantillaOncity(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la plantilla"));
    reader.onload = (e) => {
      try {
        // Guardamos el LIBRO COMPLETO, no solo la primera hoja. La plantilla de
        // OnCity puede traer hojas auxiliares (ocultas o no) y hay que
        // devolverlas intactas: si armáramos un libro nuevo, se perderían.
        const wb = XLSX.read(e.target.result, {
          type: "array", cellDates: false, cellStyles: true, bookVBA: true,
        });
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve({
          wb,
          hoja: wb.SheetNames[0],
          hojas: wb.SheetNames.slice(),
          filas: XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" }),
        });
      } catch (err) { reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}

  const fp = $("onc-plantilla"), fl = $("onc-libro");
  if (!fp.files.length || !fl.files.length) return toast("Subí los dos archivos", "warning");
  $("fac-resultado").innerHTML = spinner("Cruzando el reporte contra los pedidos de OnCity...");
  try {
    const [plantilla, facturasRows] = await Promise.all(
      [leerPlantillaOncity(fp.files[0]), parseFile(fl.files[0])]);

    const cab = (plantilla.filas[0] || []).map((h) => String(h).toLowerCase());
    if (!cab.length || cab[0].indexOf("orden") === -1) {
      throw new Error('La primera columna de la plantilla no parece ser "Nro. de orden". ' +
                      "¿Subiste el archivo exportado de OnCity?");
    }

    const r = await api("oncity.invoices", { plantilla: plantilla.filas, facturas: facturasRows });

    // Reescribimos SOBRE la plantilla que subiste: se tocan únicamente las
    // celdas que cambiaron. Así se conservan las demás hojas, cuáles estaban
    // ocultas, los desplegables y el formato de todo lo que no completamos.
    const wb = plantilla.wb;
    const ws = wb.Sheets[plantilla.hoja];

    // El backend descarta las filas sin número de orden, así que sus índices NO
    // coinciden con los de la plantilla. Emparejamos por número de orden, que es
    // lo único estable, y solo ahí escribimos.
    const filaDeOrden = new Map();
    plantilla.filas.forEach((fila, i) => {
      const orden = String((fila || [])[0] ?? "").trim();
      if (i > 0 && orden && !filaDeOrden.has(orden)) filaDeOrden.set(orden, i);
    });

    let tocadas = 0, sinUbicar = [];
    r.filas.forEach((fila, i) => {
      if (i === 0) return;                                  // encabezados: no se tocan
      const orden = String((fila || [])[0] ?? "").trim();
      if (!orden) return;
      const destino = filaDeOrden.get(orden);
      if (destino === undefined) { sinUbicar.push(orden); return; }

      (fila || []).forEach((valor, j) => {
        const antes = ((plantilla.filas[destino] || [])[j] ?? "");
        if (String(antes) === String(valor ?? "")) return;   // no cambió: no se toca
        ws[XLSX.utils.encode_cell({ r: destino, c: j })] = { t: "s", v: String(valor ?? "") };
        tocadas++;
      });
    });

    if (sinUbicar.length) {
      toast(`${sinUbicar.length} orden(es) no se pudieron ubicar en la plantilla`, "warning");
    }
    XLSX.writeFile(wb, r.archivo);
    console.log(`[OnCity] celdas modificadas: ${tocadas} · hojas conservadas: ` +
                `${(plantilla.hojas || []).join(", ")}` +
                (sinUbicar.length ? ` · sin ubicar: ${sinUbicar.join(", ")}` : ""));

    const c = r.conteo || {};
    $("fac-resultado").innerHTML = `
      <div class="border rounded-lg p-4 bg-green-50">
        <div class="font-bold mb-2">✅ Plantilla completada y descargada — ${r.completadas} factura(s) cargada(s)</div>
        <div class="text-sm mb-2">${esc(r.archivo)}</div>
        <div class="text-xs text-gray-600 mb-2">
          Se escribió sobre tu propia plantilla: ${tocadas} celda(s) modificada(s).
          Hojas conservadas tal cual: <b>${esc((plantilla.hojas || []).join(" · "))}</b>.
          ${sinUbicar.length ? `<span class="text-amber-700">No se pudieron ubicar en la
            plantilla: ${esc(sinUbicar.join(", "))}.</span>` : ""}
        </div>
        <div class="text-sm text-gray-600 mb-2">
          Cruce: <b class="text-green-700">exacto (Tango) ${c.tango || 0}</b> ·
          por documento+importe <b>${c.doc_importe || 0}</b> ·
          solo documento <b>${c.doc || 0}</b> ·
          nombre+importe <b>${c.nombre_importe || 0}</b> ·
          solo nombre <b>${c.nombre || 0}</b>
          ${(r.reexportadas || []).length ? `<div class="text-xs bg-blue-50 border border-blue-200 text-blue-900 rounded p-2 my-2">
          ℹ️ ${(r.reexportadas || []).length} orden(es) ya figuraban como exportadas, pero su
          factura está en este reporte y Tango confirma que les corresponde, así que entraron
          igual: ${esc((r.reexportadas || []).join(", "))}</div>` : ""}
        <div class="text-xs text-gray-500">Columnas usadas del reporte de Tango —
            documento: ${esc(r.columna_documento)} · importe: ${esc(r.columna_importe)}</div>
          ${r.ya_tenian ? `<div class="text-xs text-gray-500">${r.ya_tenian} fila(s) ya traían número de factura y se dejaron como estaban.</div>` : ""}
        </div>
        <div class="text-sm mb-2 ${r.sin_url && r.sin_url.length ? "text-red-800 bg-red-50 border border-red-200 rounded p-2" : "text-gray-600"}">
          📄 URL de factura: <b>${r.con_url || 0}</b> completadas
          ${r.sin_url && r.sin_url.length ? `· <b>${r.sin_url.length} SIN PDF</b>
            <div class="text-xs mt-1">En OnCity esta columna es <b>obligatoria</b>: esas filas
              van a ser rechazadas en la importación.</div>
            <div class="text-xs mt-1">${r.sin_url.slice(0, 20).map((s) => `<div>· ${esc(s.orden)} — factura ${esc(s.factura)}</div>`).join("")}
            ${r.sin_url.length > 20 ? `<div>…y ${r.sin_url.length - 20} más</div>` : ""}</div>` : ""}
        </div>
        ${r.sin_match.length ? `<div class="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded p-2 mb-2">
          ⚠️ ${r.sin_match.length} pedido(s) de la plantilla sin factura asignada:

/** Descarga el .xlsx que devuelve el backend en base64. */
function descargarXlsx(base64, nombre) {
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  const blob = new Blob([bytes],
    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── Buscador de Facturas ─────────────────────────────────────────────── */

/** De dónde sale el link que se le informa al marketplace. */
function badgeOrigen(o) {
  const v = String(o || "").trim();
  if (v === "Tango") return `<span title="El link es el de Tango. No hay copia en Drive: vence.">🔗 Tango</span>`;
  if (v === "Drive") return `<span title="Se bajó el PDF y se publicó una copia propia, que no vence.">📁 Drive</span>`;
  if (v === "Pendiente") return `<span class="text-amber-700" title="Tango la dio por facturada pero todavía no publicó el comprobante.">⏳ esperando</span>`;
  return esc(v);
}

/** Muestra la fecha de vencimiento del link de Tango, avisando si está cerca. */
function badgeVence(v) {
  v = String(v || "").trim();
  if (!v) return '<span class="text-gray-400">—</span>';
  const hoy = new Date().toISOString().slice(0, 10);
  if (v < hoy) return `<span class="text-red-700 font-bold" title="El link de Tango ya venció">⛔ ${esc(v)}</span>`;
  const en7 = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
  if (v <= en7) return `<span class="text-amber-700 font-bold" title="El link vence en menos de una semana">⚠️ ${esc(v)}</span>`;
  return `<span class="text-gray-600">${esc(v)}</span>`;
}

function limpiarBusqueda() {
  ["fb-q", "fb-desde", "fb-hasta"].forEach((id) => { if ($(id)) $(id).value = ""; });
  if ($("fb-canal")) $("fb-canal").value = "";
  ["fb-facturadas", "fb-sinpdf"].forEach((id) => { if ($(id)) $(id).checked = false; });
  if ($("fb-res")) $("fb-res").innerHTML = "";
}

async function buscarFacturas() {
  const box = $("fb-res");
  if (!box) return;
  const p = {
    q: ($("fb-q") || {}).value || "",
    desde: ($("fb-desde") || {}).value || "",
    hasta: ($("fb-hasta") || {}).value || "",
    canal: ($("fb-canal") || {}).value || "",
    solo_facturadas: ($("fb-facturadas") || {}).checked ? "1" : "",
    solo_sin_pdf: ($("fb-sinpdf") || {}).checked ? "1" : "",
  };
  if (!p.q.trim() && !p.desde && !p.hasta && !p.canal && !p.solo_facturadas && !p.solo_sin_pdf) {
    return toast("Escribí algo para buscar o elegí un rango de fechas", "warning");
  }

  box.innerHTML = spinner("Buscando...");
  let r;
  try { r = await api("facturas.buscar", p); }
  catch (e) { box.innerHTML = `<p class="text-red-600 text-sm">${esc(e.message)}</p>`; return; }
  if (!$("fb-res")) return;

  if (!r.total) {
    box.innerHTML = `<div class="border border-amber-200 bg-amber-50 rounded-lg p-3 text-sm text-amber-900">
      No se encontró nada con eso. Probá con menos palabras, o solo con el DNI o el número de orden.
      Acordate de que solo se busca entre los pedidos que esta app mandó a Tango.</div>`;
    return;
  }

  window._FB = r.filas;
  box.innerHTML = `
    <div class="text-xs text-gray-600 mb-2">
      <b>${r.total}</b> resultado(s) · <b class="text-green-700">${r.con_pdf}</b> con PDF ·
      <b class="${r.sin_pdf ? "text-amber-700" : ""}">${r.sin_pdf}</b> sin PDF
    </div>
    <div class="overflow-x-auto">
    <table class="data w-full"><thead><tr>
      <th>Orden</th><th>Canal</th><th>Cliente</th><th>DNI / CUIT</th><th>Fecha</th>
      <th>Total</th><th>Factura</th><th>PDF</th><th>Vence</th><th></th>
    </tr></thead><tbody>
    ${r.filas.map((f, n) => `<tr>
      <td class="font-mono text-xs whitespace-nowrap">${esc(f.order_id)}</td>
      <td class="text-xs">${esc(f.canal)}</td>
      <td class="text-xs max-w-[14rem] truncate" title="${esc(f.cliente)}">${esc(f.cliente)}</td>
      <td class="font-mono text-xs">${esc(f.documento)}</td>
      <td class="text-xs text-gray-500 whitespace-nowrap">${esc(f.fecha_factura || f.fecha_compra)}</td>
      <td class="text-xs text-right">${f.total === "" || f.total === null || f.total === undefined ? "" : esc(f.total)}</td>
      <td class="font-mono text-xs whitespace-nowrap">${f.nro_factura
        ? `${esc(f.nro_factura)}${f.factura_de_tango
            ? ` <span class="text-[10px] text-gray-400 font-sans" title="Número tomado del comprobante de Tango: todavía no subiste el reporte de facturación">de Tango</span>`
            : ""}`
        : '<span class="text-gray-400">sin facturar</span>'}</td>
      <td>${f.url
        ? `<a href="${esc(f.url)}" target="_blank" class="text-violet-700 underline text-xs">abrir</a>`
        : '<span class="text-amber-700 text-xs">falta</span>'}</td>
      <td class="text-xs whitespace-nowrap">${badgeVence(f.vence)}</td>
      <td class="whitespace-nowrap">
        ${f.url ? `<button onclick="copiarUrlFactura(${n})" class="text-xs border rounded px-2 py-1">Copiar link</button>`
                : `<button onclick="traerPdfDe(${n})" class="text-xs bg-violet-700 text-white rounded px-2 py-1">Traer PDF</button>`}
      </td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function copiarUrlFactura(n) {
  const f = (window._FB || [])[n];
  if (!f || !f.url) return;
  const ta = document.createElement("textarea");
  ta.value = f.url; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Link copiado", "ok"); }
  catch (e) { toast("Copialo a mano desde la columna PDF", "warning"); }
  ta.remove();
}

/** Le pide a Tango el comprobante de esa orden puntual y refresca la búsqueda. */
async function traerPdfDe(n) {
  const f = (window._FB || [])[n];
  if (!f) return;
  const orden = f.order_id;
  if (!orden) return toast("Esa fila no tiene número de orden", "warning");
  toast("Consultando a Tango...", "info");
  let r;
  try { r = await api("pdfs.buscar", { orden, factura: f.nro_factura || "" }); }
  catch (e) { return toast(e.message, "error"); }
  if (r.ok) { toast("PDF encontrado", "ok"); buscarFacturas(); cargarPdfs(); }
  else {
    showModal(`<h3 class="font-bold text-lg mb-2">No se encontró el PDF de ${esc(orden)}</h3>
      <div class="text-sm text-gray-700 mb-3">${esc(r.sugerencia || "")}</div>
      <pre class="text-xs bg-gray-50 border rounded p-2 whitespace-pre-wrap break-all">${esc(r.diagnostico || "")}</pre>
      <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);
  }
}

/**
 * Vuelve a preguntar por los comprobantes que Tango todavía no había publicado
 * cuando llegó el aviso, y completa en el historial las órdenes que figuran
 * sin facturar pero que ya tienen su factura registrada.
 */
async function reintentarFacturas() {
  showModal(`<h3 class="font-bold text-lg mb-3">Reintentando…</h3>${spinner()}`);
  let r;
  try { r = await api("facturas.reintentar"); }
  catch (e) {
    return showModal(`<h3 class="font-bold text-lg mb-3">Reintento</h3>
      <p class="text-red-600 text-sm">${esc(e.message)}</p>
      <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);
  }
  const h = r.historial || {};
  showModal(`
    <h3 class="font-bold text-lg mb-3">Reintento de comprobantes</h3>
    <div class="text-sm space-y-1 mb-3">
      <div>Órdenes que estaban esperando el PDF: <b>${r.pendientes}</b></div>
      <div class="text-green-700">Resueltas ahora: <b>${r.resueltas}</b></div>
      ${r.siguen ? `<div class="text-amber-700">Siguen sin comprobante: <b>${r.siguen}</b>
        <div class="text-xs text-gray-600">Tango todavía no lo publicó. Si pasan varias horas,
          revisá que el talonario tenga tildado "Publica comprobantes en Tango Tiendas".</div></div>` : ""}
      ${h.completadas ? `<div class="text-green-700">Órdenes que pasaron de "sin facturar" a
        facturadas en el historial: <b>${h.completadas}</b></div>` : ""}
      ${h.sin_orden ? `<div class="text-gray-600">Comprobantes sin orden en el historial:
        <b>${h.sin_orden}</b> (facturas de otros circuitos)</div>` : ""}
      ${r.truncado ? `<div class="text-amber-700">Se cortó por tiempo: volvé a tocarlo para seguir.</div>` : ""}
      ${!r.pendientes && !h.completadas ? `<div class="text-gray-600">No había nada pendiente.</div>` : ""}
    </div>
    <div class="mt-4 text-right"><button onclick="closeModal(); viewPdfs();" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);
}

/**
 * Reparación puntual del error de las versiones .23 y .24: las órdenes que el

      <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);
  }

function copiarEvento(n) {
  const e = (window._EVENTOS || [])[n];
  if (!e) return;
  const txt = `TOPICO: ${e.topic}\nRECURSO: ${e.resource}\nRESULTADO: ${e.resultado}\n` +
              `DETALLE: ${e.detalle}\nCRUDO: ${e.raw}`;
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Copiado", "ok"); }
  catch (err) { toast("Copialo a mano del recuadro", "warning"); }
  ta.remove();
}

async function guardarSku(originalSku, pendOrigen, pendSku) {

      fravega_refid: $("f-refid").value.trim(),

      oncity_sku_id: $("f-onid").value.trim(),
      descripcion: $("f-desc").value.trim(),

    if (pendOrigen && pendSku) {

    (location.hash.startsWith("#pendientes") ? viewPendientes : viewSkus)();

// Alias de encabezados aceptados al importar
const SKU_ALIASES = {
  sku_tango: ["sku_tango", "sku tango", "tango", "skucode", "codigo tango", "código tango"],
  fravega_item_id: ["fravega_item_id", "item_id", "sku fravega", "sku_fravega", "id publicacion", "productcode"],
  fravega_refid: ["fravega_refid", "refid", "ref_id", "reference id"],
  oncity_refid: ["oncity_refid", "refid oncity", "sku oncity", "sku_oncity", "vtex_refid", "refid vtex"],
  oncity_sku_id: ["oncity_sku_id", "sku id vtex", "skuid", "sku_id", "id vtex", "vtex_sku_id", "id sku vtex"],
  descripcion: ["descripcion", "descripción", "description", "detalle"],
};

async function importarSkus(input) {
  if (!input.files.length) return;
  try {
    const raw = await parseFile(input.files[0]);
    const rows = raw.map((r) => {
      const o = {};
      Object.keys(r).forEach((k) => {
        const key = k.trim().toLowerCase();
        for (const target in SKU_ALIASES) {
          if (SKU_ALIASES[target].includes(key)) o[target] = r[k];
        }
      });
      return o;
    });
    const res = await api("skus.import", { rows });
    toast(`Importación: ${res.creadas} creadas, ${res.actualizadas} actualizadas` +
          (res.errores.length ? `, ${res.errores.length} errores` : ""),
          res.errores.length ? "warning" : "ok");
    if (res.errores.length) showModal(`<h3 class="font-bold mb-3">Errores de importación</h3>
      <div class="text-sm space-y-1">${res.errores.map((e) => `<div>· ${esc(e)}</div>`).join("")}</div>
      <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);
    viewSkus();
  } catch (e) { toast(e.message, "error"); }
  input.value = "";
}

async function exportarSkus() {
  const rels = window._SKUS_CACHE || await api("skus.list", { q: "" });
  const lines = ["sku_tango,fravega_item_id,fravega_refid,oncity_refid,oncity_sku_id,descripcion"];
  rels.forEach((r) => {
    const desc = String(r.descripcion || "").replace(/"/g, "'");
    lines.push(`${r.sku_tango},${r.fravega_item_id || ""},${r.fravega_refid},` +
               `${r.oncity_refid || r.sku_tango},${r.oncity_sku_id || ""},"${desc}"`);
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "relaciones_sku.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

      <td class="font-mono">${esc(p.sku)}</td>
      <td>${badge(p.origen, p.origen === "Tango" ? "info" : "warning")}</td>

      <td class="text-sm">${esc(p.observaciones || "")}</td>
      <td class="whitespace-nowrap">
        <button class="text-violet-700 underline text-sm mr-2"
          onclick="formSku(null, '${esc(p.sku)}', '${esc(p.origen)}')">Crear relación</button>

          onclick="resolverPendiente('${esc(p.sku)}', '${esc(p.origen)}')">Marcar resuelto</button></td>
    </tr>`).join("") || '<tr><td colspan="5" class="text-gray-400 p-4">No hay pendientes 🎉</td></tr>'}
    </tbody></table>`)}`);

function resolverPendiente(sku, origen) {
  confirmar("¿Marcar este SKU como resuelto?", async () => {
    try { await api("pending.resolve", { sku, origen }); toast("Marcado como resuelto", "ok"); viewPendientes(); }
    catch (e) { toast(e.message, "error"); }
  });
}

let LOGS_CACHE = [];
async function cargarLogs() {
  $("logs-tabla").innerHTML = spinner();
  try {
    LOGS_CACHE = await api("logs.list", {
      desde: $("l-desde").value, hasta: $("l-hasta").value,
      modulo: $("l-modulo").value, resultado: $("l-res").value, q: $("l-q").value,
    });
  } catch (e) { return $("logs-tabla").innerHTML = `<p class="text-red-600">${esc(e.message)}</p>`; }
  $("logs-tabla").innerHTML = card(`
    <table class="data w-full"><thead><tr>
      <th>Fecha/hora</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Resultado</th>
      <th>Detalle</th><th>ms</th></tr></thead><tbody>
    ${LOGS_CACHE.map((l) => `<tr>
      <td class="whitespace-nowrap text-xs">${esc(l.fecha_hora)}</td>
      <td class="text-xs">${esc(l.usuario)}</td><td>${esc(l.modulo)}</td>
      <td>${esc(l.accion)}</td><td>${resultadoBadge(l.resultado)}</td>
      <td class="text-xs text-gray-600 max-w-md truncate" title="${esc(l.detalle)}">${esc(l.detalle)}</td>
      <td class="text-xs text-gray-400">${l.duracion_ms || ""}</td></tr>`).join("")
      || '<tr><td colspan="7" class="text-gray-400 p-4">Sin registros</td></tr>'}
    </tbody></table>
    <div class="text-xs text-gray-400 mt-2">${LOGS_CACHE.length} registro(s) —
      el historial completo está en la pestaña Logs de la Google Sheet</div>`);
}

function descargarLogs() {
  const lines = ["fecha_hora,usuario,modulo,accion,resultado,detalle,duracion_ms"];
  LOGS_CACHE.forEach((l) => {
    const det = String(l.detalle || "").replace(/"/g, "'").replace(/\n/g, " ");
    lines.push(`${l.fecha_hora},${l.usuario},${l.modulo},"${String(l.accion).replace(/"/g, "'")}",${l.resultado},"${det}",${l.duracion_ms || ""}`);
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "logs.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

// Trae los depósitos de VTEX y los carga en el selector de Configuración.
async function cargarDepositosVtex() {
  const sel = $("cfg-wh"), msg = $("cfg-wh-msg");
  if (!sel) return;
  msg.textContent = "Consultando VTEX...";
  try {
    const ws = await api("oncity.warehouses");
    const actual = sel.value;
    sel.innerHTML = '<option value="">— sin elegir —</option>' +
      ws.map((w) => `<option value="${esc(w.id)}" ${w.id === actual ? "selected" : ""}>${esc(w.name)} (${esc(w.id)})</option>`).join("");
    msg.textContent = `${ws.length} depósito(s) encontrados. Elegí el que recibe el stock y guardá.`;
  } catch (e) {
    msg.textContent = "No se pudieron traer los depósitos: " + e.message;
  }
}

// Diagnóstico de OnCity: conexión, depósitos y traducción de los primeros refId.
async function probarOncity() {
  showModal(`<h3 class="font-bold text-lg mb-3">Probando OnCity…</h3>${spinner("Consultando VTEX...")}`);
  let r;
  try { r = await api("oncity.test"); }
  catch (e) { return showModal(`<h3 class="font-bold text-lg mb-3">Probar OnCity</h3>
    <p class="text-red-600 text-sm">${esc(e.message)}</p>
    <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`); }
  showModal(`
    <h3 class="font-bold text-lg mb-3">Probar OnCity (VTEX)</h3>
    <div class="mb-3 text-sm">${r.conexion.ok
      ? '<span class="text-green-700 font-bold">● Conectado</span>'
      : '<span class="text-red-600 font-bold">● Sin conexión</span>'} — ${esc(r.conexion.detalle)}</div>
    ${r.depositos && r.depositos.length ? `<div class="text-xs text-gray-500 uppercase mb-1">Depósitos de VTEX</div>
      <table class="data w-full mb-4"><tbody>${r.depositos.map((w) =>
        `<tr><td class="font-mono">${esc(w.id)}</td><td>${esc(w.name)}</td></tr>`).join("")}</tbody></table>` : ""}
    ${r.muestra && r.muestra.length ? `<div class="text-xs text-gray-500 uppercase mb-1">Traducción de SKU (muestra)</div>
      <table class="data w-full"><thead><tr><th>SKU Tango</th><th>refId</th><th>SKU id en VTEX</th></tr></thead>
      <tbody>${r.muestra.map((m) => `<tr><td class="font-mono">${esc(m.sku_tango)}</td>
        <td class="font-mono">${esc(m.refid)}</td>
        <td class="font-mono ${String(m.sku_id).indexOf("no encontrado") !== -1 ? "text-red-600" : "text-green-700"}">${esc(m.sku_id)}</td></tr>`).join("")}
      </tbody></table>` : ""}
    <div class="mt-4 text-right"><button onclick="closeModal()" class="px-4 py-2 border rounded-lg">Cerrar</button></div>`);
}

async function guardarConfig() {
  const valores = {};
  document.querySelectorAll(".cfg-input").forEach((el) => {
    valores[el.dataset.key] = el.type === "checkbox" ? (el.checked ? "1" : "0") : el.value.trim();
  });
  try {
    const r = await api("settings.set", { valores });
    const ag = r.agendados || {};
    toast("Configuración guardada", "ok");
    if (r.ignoradas && r.ignoradas.length) {
      toast(`Se ignoraron claves desconocidas: ${r.ignoradas.join(", ")}`, "warning");
    }
    if (r.proxima_sincronizacion) toast(`Stock: próxima ${r.proxima_sincronizacion} · ${ag.stock || 0} horario(s)`, "info");
    if (r.proxima_ordenes) toast(`Órdenes: próxima ${r.proxima_ordenes} · ${ag.ordenes || 0} horario(s) agendados`, "info");
    else toast(`Órdenes: automático apagado`, "info");
  } catch (e) { toast(e.message, "error"); }
}
